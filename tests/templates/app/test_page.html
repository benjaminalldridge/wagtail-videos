{% load wagtailvideos_tags %}
{# The example page applies the saved value to its full content wrapper. #}
<main{% if page.page_background_colour %} style="background-color: {{ page.page_background_colour }}"{% endif %}>
    <h1>{{ page.title }}</h1>

    {% if self.video_field %}
        {% video self.video_field controls %}
    {% endif %}

    {{ self.video_streamfield }}
</main>
